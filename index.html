<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE-edge">
  <title> CandyWorld </title>
  <link
    href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@300..700&family=Henny+Penny&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="icon" type="image/x-icon" href="Assets/favicon.ico" />
</head>

<body>
  <div id="loadingOverlay" class="loadingOverlay">
    <img src="Assets/Candies/loadingCandyResized.webp" alt="Loading..." class="spinner" />
    <p class="loadingText">Loading CandyWorld...</p>
    <div style="width: 200px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-top: 1rem; overflow: hidden;">
      <div id="loadingProgress" style="width: 0%; height: 100%; background: linear-gradient(90deg, #ff6b9d, #c255b3); transition: width 0.3s ease;"></div>
    </div>
    <p id="loadingPercentage" class="loadingText" style="font-size: 0.9rem; margin-top: 0.5rem;">0%</p>
  </div>

  <div id="errorOverlay" class="loadingOverlay hidden" style="background-color: rgba(0, 0, 0, 0.9);">
    <h2 style="color: #ff6b6b; font-family: 'Fredoka', sans-serif; margin-bottom: 1rem;">Oops! Something went wrong</h2>
    <p id="errorMessage" style="color: white; font-family: 'Fredoka', sans-serif; margin-bottom: 1.5rem;">Having trouble loading CandyWorld...</p>
    <button id="retryButton" class="restartButton">Try Again</button>
  </div>

  <canvas class="webgl"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/"
      }
    }
  </script>

  <div id="instructions" class="hidden">
    <p>Click the candy to earn points!</p>
  </div>

  <div id="transMessage" class="hidden">
    <h1>Level Up! Traveling to the Next World...</h1>
  </div>

  <div id="finaleMessage" class="hidden">
    <h1>You've reached the final world!</h1>
    <button id="restartButton" class="restartButton">Play Again</button>
  </div>

  <div class="uiPanel">
    <h1> Welcome to the Candyverse </h1>
    <button id="startButton" type="button" data-target-world="Gumdrop">LET'S BEGIN</button>
  </div>

  <div class="scorePanel hidden">
    <h2 id="scoreDisplay">Score: 0 </h2>
    <h3 id="highScoreDisplay" style="font-family: 'Fredoka', sans-serif; color: #ffd700; font-size: 1rem; margin-top: 0.5rem;">High Score: 0</h3>
  </div>

  <button id="soundToggle" class="soundButton" title="Toggle Sound">🔊</button>

  <script type="module" src="index.js"></script>

</body>

</html>
